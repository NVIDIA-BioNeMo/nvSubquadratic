name: GPU tests

# `gpu-tests` is a *required* status check on `main` (repo ruleset). It runs on
# every PR (no path filter) so the required status is always reported — a
# path-filtered required check never reports on non-matching PRs and blocks
# merge forever ("Expected — waiting for status to be reported").

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs for the same PR/branch when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs on a self-hosted Colossus GPU runner; provisioning is out-of-tree.
  # GHCR registry cache means even a fresh runner skips the Apex compile (~30 min)
  # by pulling cached layers. Warm runs (code-only changes) are ~5 min.
  gpu-tests:
    runs-on: [self-hosted, gpu, colossus]
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to diff against the PR base for the scope check below.
          fetch-depth: 0

      # The job itself must ALWAYS run so the required status is reported (see
      # the note at the top of this file). What it may skip is the expensive
      # part: a ~36-minute image build + GPU suite is wasted on a PR that only
      # touches docs or config.
      #
      # Fail-safe by construction: the suite is skipped ONLY when every changed
      # file matches a known-inert pattern. Anything unrecognised runs the full
      # job, so a new source directory can never be silently skipped.
      - name: Decide whether the GPU suite is needed
        id: scope
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull_request (${{ github.event_name }}) - running in full."
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE='${{ github.event.pull_request.base.sha }}'
          CHANGED="$(git diff --name-only "$BASE"...HEAD)"
          if [ -z "$CHANGED" ]; then
            echo "No changed files detected - running in full (fail-safe)."
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"; echo "$CHANGED" | sed 's/^/  /'
          # Inert: documentation and repo/review config that cannot affect the
          # image or the tests. Uses shell `case` globs rather than a regex:
          # portable, and no dependency on which grep implementation the runner
          # happens to provide.
          #
          # Deliberately NOT inert - each can change what the suite does:
          #   this workflow, Dockerfile, pyproject.toml, requirements*.txt,
          #   and every source/test path.
          NEEDED=false
          OLD_IFS=$IFS
          IFS=$'\n'   # split on newlines only, so paths with spaces survive
          for f in $CHANGED; do
            case "$f" in
              docs/*|*.md|.coderabbit.yaml|.gitignore|.github/CODEOWNERS|LICENSE|THIRD_PARTY_NOTICES.txt)
                ;;
              *)
                echo "Source-affecting change: $f"
                NEEDED=true
                break
                ;;
            esac
          done
          IFS=$OLD_IFS
          if [ "$NEEDED" = true ]; then
            echo "Running the GPU suite."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "All changes are documentation/config - skipping the GPU suite."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.scope.outputs.needed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.scope.outputs.needed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure build cache
        if: steps.scope.outputs.needed == 'true'
        uses: int128/docker-build-cache-config-action@v1
        id: cache
        with:
          image: ghcr.io/nvidia-bionemo/nvsubquadratic/ci-cache

      - name: Build image
        if: steps.scope.outputs.needed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          build-args: |
            TORCH_CUDA_ARCH_LIST=9.0
          tags: |
            nvsubquadratic-ci:${{ github.sha }}
            nvsubquadratic-ci:latest
          cache-from: |
            ${{ steps.cache.outputs.cache-from }}
            type=registry,ref=ghcr.io/nvidia-bionemo/nvsubquadratic/ci-cache:main
          cache-to: ${{ steps.cache.outputs.cache-to }}

      - name: Run pytest
        if: steps.scope.outputs.needed == 'true'
        run: |
          # pytest runs inside the container, so coverage has to be written to a
          # bind mount or it disappears with --rm. The image runs as USER ubuntu
          # (Dockerfile:218), whose uid need not match the runner's, hence 777.
          mkdir -p "${{ github.workspace }}/coverage"
          chmod 777 "${{ github.workspace }}/coverage"
          docker run --rm --gpus all \
            -v "${{ github.workspace }}/coverage:/coverage" \
            nvsubquadratic-ci:${{ github.sha }} \
            python -m pytest nvsubquadratic/ tests/ -v --tb=short \
              --cov-report=xml:/coverage/coverage.xml
          # --cov and --cov-report=term already come from pyproject addopts; this
          # only adds the machine-readable report Codecov needs.

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        continue-on-error: true
        with:
          files: ${{ github.workspace }}/coverage/coverage.xml
          # Never let a Codecov outage or a missing token fail the job this
          # workflow exists for. gpu-tests is a required status check and takes
          # ~36 minutes; coverage reporting is not worth blocking a merge over.
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run distributed CP tests
        if: steps.scope.outputs.needed == 'true'
        run: |
          GPU_COUNT=$(docker run --rm --gpus all \
            nvsubquadratic-ci:${{ github.sha }} \
            python -c "import torch; print(torch.cuda.device_count())")
          if [ "$GPU_COUNT" -ge 2 ]; then
            docker run --rm --gpus all \
              nvsubquadratic-ci:${{ github.sha }} \
              torchrun --nproc_per_node=2 \
                tests/modules/torchrun_sequence_mixer_cp_test.py \
                --context_parallel_size=2 --dtype=float32
          else
            echo "Skipping distributed tests: $GPU_COUNT GPU(s) available, need 2+"
          fi

      - name: Clean up old images
        if: always()
        run: docker image prune -f --filter "until=24h"
